; Identifiants AdMob de PRODUCTION — modèle.
; Copier en « ads_ids.cfg » (même dossier, ignoré par git) et remplir.
; Lus UNIQUEMENT dans une build release : en debug, le jeu utilise toujours
; les identifiants de test Google (data/ads.tres), quoi que contienne ce fichier.
; L'App ID de chaque plateforme est posé dans le manifeste / Info.plist au
; moment de l'export release par addons/_fv_release (jamais dans project.godot).
; Android et iOS sont deux applis distinctes dans AdMob : identifiants différents.

[android]
app_id="ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY"
rewarded_id="ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ"
interstitial_id="ca-app-pub-XXXXXXXXXXXXXXXX/WWWWWWWWWW"

[ios]
app_id="ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY"
rewarded_id="ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ"
interstitial_id="ca-app-pub-XXXXXXXXXXXXXXXX/WWWWWWWWWW"
